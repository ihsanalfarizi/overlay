<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Overlay Notifikasi Galatama</title>
<style>
:root{--bg:#0a1115;--card:rgba(255,255,255,.045);--line:rgba(255,255,255,.09);--txt:#e9f1f3;--mut:#8da3ab;--acc:#2ee59d;--acc2:#16b97a;--gold:#ffc83d;--silver:#c3ccd4;--bronze:#d8894a;--red:#ff5d6c;--amber:#fbbf24;--blue:#60a5fa;--r:16px;
  /* variabel tema */
  --ov:255,255,255;--pop:#121d23;--pop2:#14202a;--inp:rgba(0,0,0,.25);--inp2:rgba(0,0,0,.2);--hd:#fff;--sub:#c5d2d8;
  --ptbg:rgba(255,255,255,.1);--ptfg:#fff;--dotb:#101a20;--toast:rgba(18,29,35,.78);--toast2:rgba(18,29,35,.95);
  --rt:#ff8a96;--rt2:#ff9aa4;--gt:#6ee7a8;--bt:#93c5fd;--yt:#fde047;--blob:.26;--shadow:rgba(0,0,0,.6)}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:transparent;overflow:hidden}
body{color:var(--txt);font:600 15px/1.35 system-ui,"Segoe UI",sans-serif}
@keyframes blink{50%{opacity:.35}}
@keyframes toast-in{from{opacity:0;transform:translateY(14px) scale(.96)}}
.bd{padding:1px 9px;border-radius:20px;color:#111;font-size:12px;font-weight:800}
.bd.lg{background:#f59e0b}.bd.my{background:#ff4d4d}.bd.sc{background:#3ddc84}.bd.fg{background:#2dd4bf}.bd.vr{background:#334852;color:#e8eef0}
.bd.mu{text-shadow:none}.bd.mu.holo{background:linear-gradient(90deg,#ff5f6d,#ffc371,#fff75e,#5ef28a,#5ec8ff,#b86bff);color:#111}
.toast{--tc:#f59e0b;--tc2:#ffd75e;position:relative;display:flex;flex-direction:column;gap:7px;width:min(330px,92vw);padding:0 12px 11px;overflow:hidden;border:2px solid var(--tc);border-radius:15px;background:linear-gradient(160deg,color-mix(in srgb,var(--tc) 38%,var(--toast2)),color-mix(in srgb,var(--tc) 12%,var(--toast2)) 70%);box-shadow:0 14px 36px rgba(0,0,0,.5),0 0 40px color-mix(in srgb,var(--tc) 60%,transparent);animation:toast-in .4s cubic-bezier(.2,.9,.3,1.25);transition:opacity .3s,transform .3s}
.toast.t-lg{--tc:#f59e0b;--tc2:#ffd75e}.toast.t-my{--tc:#ff3b3b;--tc2:#ff9a8a}.toast.t-sc{--tc:#22d36f;--tc2:#b6ffd9}.toast.t-fg{--tc:#14c8b4;--tc2:#a7f3e8}.toast.t-man{--tc:#60a5fa;--tc2:#c3dcff}.toast.t-neg{--tc:#ff3b52;--tc2:#ff8a96;animation:toast-in .4s cubic-bezier(.2,.9,.3,1.25),tshake .5s .35s}
.toast .rib{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:0 -12px;padding:4px 12px;font-size:12px!important;background:linear-gradient(90deg,var(--tc),var(--tc2));color:#101010;font-size:12.5px;font-weight:900;letter-spacing:1.3px}
.toast.t-neg .rib{color:#fff}
.toast .rib em{font-style:normal;padding:0 8px;border-radius:10px;background:rgba(0,0,0,.18);font-size:11px;animation:blink 1.2s ease-in-out infinite}
.toast .who{display:flex;align-items:center;gap:10px;min-width:0}
.toast .ta{width:28px;height:28px;flex:none;border-radius:50%;object-fit:cover;background:var(--pop2);border:2px solid var(--tc)}
.toast .ta0{display:grid;place-items:center;color:var(--mut);font-size:13px;font-weight:800}
.toast .tn{min-width:0;overflow:hidden;color:var(--hd);font-size:16px;font-weight:900;text-overflow:ellipsis;white-space:nowrap}
.toast .tbody{display:flex;align-items:center;gap:10px}
.toast .tpic{position:relative;display:grid;place-items:center;flex:none;width:56px;height:56px;border:2px solid var(--tc);border-radius:13px;background:var(--pop2);font-size:26px;box-shadow:0 0 22px color-mix(in srgb,var(--tc) 55%,transparent)}
.toast .tpic::before{content:"";position:absolute;inset:-10px;z-index:-1;border-radius:50%;background:repeating-conic-gradient(color-mix(in srgb,var(--tc) 45%,transparent) 0 8deg,transparent 8deg 24deg);-webkit-mask:radial-gradient(circle,#000 28%,transparent 68%);mask:radial-gradient(circle,#000 28%,transparent 68%);animation:tspin 7s linear infinite}
.toast .tpic img{position:absolute;inset:0;width:100%;height:100%;border-radius:11px;object-fit:contain;background:var(--pop2);animation:tpopi .5s cubic-bezier(.2,1.5,.4,1) .1s backwards}
.toast .tinfo{display:flex;flex:1;flex-direction:column;gap:3px;min-width:0}
.toast .tbd{display:flex;flex-wrap:wrap;gap:5px}
.toast .tk{font-size:10px;font-weight:900;letter-spacing:1.4px;color:var(--tc)}
.toast .tfish{color:var(--hd);font-size:15px;font-weight:900;line-height:1.2;overflow-wrap:anywhere}
.toast .tsub{color:var(--mut);font-size:11px;font-weight:700}
.toast .tl2{display:flex;flex-direction:column;gap:5px;min-width:0}
.toast .tr2{display:flex;align-items:center;gap:8px;min-width:0}
.toast .tr2 .tf2{flex:1;min-width:0;overflow:hidden;color:var(--hd);font-size:13px;font-weight:800;text-overflow:ellipsis;white-space:nowrap}
.toast .tr2 b{flex:none;color:var(--tc);font-size:14px;font-weight:900}
.toast .tr2.more{color:var(--mut);font-size:13px;font-weight:700}
.toast .gain{display:flex;flex:none;flex-direction:column;align-items:center;justify-content:center;width:56px;height:56px;border-radius:50%;background:radial-gradient(circle at 30% 25%,var(--tc2),var(--tc));color:#101010;box-shadow:0 0 0 3px color-mix(in srgb,var(--tc) 25%,transparent),0 0 16px color-mix(in srgb,var(--tc) 60%,transparent);animation:gpop .55s cubic-bezier(.2,1.7,.4,1) .15s backwards}
.toast.t-neg .gain{color:#fff}
.toast .gain b{font-size:22px;font-weight:900;line-height:1}
.toast .gain small{margin-top:1px;font-size:8px;font-weight:900;letter-spacing:1.4px;opacity:.8}
.toast .tfoot{display:flex;align-items:center;gap:8px;padding-top:6px;border-top:1px dashed color-mix(in srgb,var(--tc) 45%,transparent);color:var(--mut);font-size:12px;font-weight:700}
.toast .tfoot s{opacity:.65}
.toast .tfoot i{margin-left:auto;color:var(--tc);font-size:10px;font-style:normal;font-weight:900;letter-spacing:1px}
.toast .tfoot i b{margin-left:4px;color:var(--hd);font-size:20px;font-weight:900;letter-spacing:0}
.toast .tbar{position:absolute;left:0;bottom:0;width:100%;height:4px;background:linear-gradient(90deg,var(--tc),var(--tc2));transform-origin:left;animation:tshrink 4.5s linear forwards}
.toast .sp{position:absolute;width:7px;height:7px;border-radius:50%;background:var(--tc2);box-shadow:0 0 8px var(--tc);opacity:0;pointer-events:none;animation:twk 1.6s ease-in-out infinite}
@keyframes tshrink{to{transform:scaleX(0)}}
@keyframes tshine{to{transform:translateX(100%)}}
@keyframes tspin{to{transform:rotate(360deg)}}
@keyframes gpop{from{transform:scale(.2) rotate(-25deg);opacity:0}}
@keyframes tpopi{from{transform:scale(.5);opacity:0}}
@keyframes twk{0%,100%{opacity:0;transform:scale(.3)}50%{opacity:1;transform:scale(1.2)}}
@keyframes tshake{20%{transform:translateX(-8px)}40%{transform:translateX(7px)}60%{transform:translateX(-5px)}80%{transform:translateX(3px)}}
.toast.t-my::after,.toast.t-sc::after,.toast.t-fg::after{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 35%,rgba(255,255,255,.22) 50%,transparent 65%);transform:translateX(-100%);animation:tshine 1.2s .3s ease-out 1;pointer-events:none}
.toast.out{opacity:0;transform:translateY(8px)}
/* Posisi kartu (atur lewat ?pos=) dan ukuran (?scale=) */
#toasts{position:fixed;z-index:10;display:flex;flex-direction:column;gap:10px;pointer-events:none;zoom:var(--sc,1);top:12px;left:50%;transform:translateX(-50%)}
#toasts.tl{left:12px;transform:none}
#toasts.tr{left:auto;right:12px;transform:none}
#toasts.bl,#toasts.bc,#toasts.br{top:auto;bottom:12px}
#toasts.bl{left:12px;transform:none}
#toasts.br{left:auto;right:12px;transform:none}
#dbg{position:fixed;left:6px;bottom:4px;z-index:20;padding:2px 8px;border-radius:10px;background:rgba(0,0,0,.6);color:#fff;font:700 11px system-ui,sans-serif}
#dbg.bad{background:#b91c1c}
</style>
</head>
<body>
<div id="toasts"></div>
<div id="dbg" hidden>menunggu data…</div>
<script>
/* Overlay notifikasi Galatama (untuk TikTok LIVE Studio / OBS)
   Letakkan file ini satu folder dengan klasemen_api.php, lalu buka:  .../overlay.html
   Pilihan lewat alamat (URL):
     ?pos=tc|tl|tr|bc|bl|br   posisi kartu (bawaan tc = atas tengah)
     ?scale=1.2               perbesar / perkecil kartu
     ?max=4                   jumlah kartu maksimal di layar
     ?snd=1                   bunyikan suara (bawaan mati)
     ?bg=00ff00               warna latar (untuk chroma key); bawaan transparan
     ?demo=1                  tampilkan contoh notifikasi tiap 5 detik (untuk mengatur posisi)
     ?debug=1                 tampilkan status koneksi di pojok kiri bawah
     ?api=alamat              alamat klasemen_api.php bila beda folder */
const Q = new URLSearchParams(location.search);
const $ = s => document.querySelector(s);
const SND = Q.get('snd') === '1';
const MAXT = Math.max(1, Math.min(10, parseInt(Q.get('max'), 10) || 4));
const API = Q.get('api') || 'klasemen_api.php';
{ const tt = $('#toasts'), p = (Q.get('pos') || 'tc').toLowerCase(); if (['tl', 'tr', 'bl', 'bc', 'br'].includes(p)) tt.className = p;
  const sc = parseFloat(Q.get('scale')); if (sc > 0) tt.style.setProperty('--sc', Math.min(4, sc));
  const bg = (Q.get('bg') || '').replace('#', ''); if (/^[0-9a-f]{3,8}$/i.test(bg)) document.documentElement.style.background = document.body.style.background = '#' + bg; }
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const initial = nm => esc(([...nm][0] || '?').toUpperCase());
const tcls = t => /forgotten/i.test(t) ? 'fg' : /secret/i.test(t) ? 'sc' : /myth/i.test(t) ? 'my' : 'lg';
// Warna mutasi disamakan dengan warna di chat game. Nama dicocokkan sebagian kata (huruf besar/kecil bebas).
// [kata kunci, warna latar, warna teks]. Tambah / ubah baris di sini bila ada mutasi baru.
const MUT_COLORS = [
  ['holo',        '#7fd8ff', '#111'],      // Holographic = biru muda
  ['fairy',       '#ff8fd8', '#111'],      // Fairy Dust
  ['radioactive', '#7dff2e', '#111'],
  ['frozen',      '#cfe9ff', '#111'],
  ['galaxy',      '#9b5cff', '#fff'],
  ['gemstone',    '#ff6fae', '#111'],
  ['corrupt',     '#7a2cc9', '#fff'],
  ['lightning',   '#ffe14d', '#111'],
  ['ghost',       '#cfd8e3', '#111'],
  ['midnight',    '#2f5bff', '#fff'],
  ['duskbreaker', '#ff8a3d', '#111'],
  ['stone',       '#9aa3ab', '#111'],
  ['sandy',       '#e6c98a', '#111'],
  ['festive',     '#ff4d4d', '#fff'],
  ['disco',       '#ff7be5', '#111'],
  ['albino',      '#f4f4f4', '#111'],
  ['shiny',       '#ffd84d', '#111'],
  ['big',         '#8fb3c4', '#111'],
];
function varBadges(v) {
  return String(v || '').split(/\s*,\s*/).filter(Boolean).map(x => {
    const m = MUT_COLORS.find(c => x.toLowerCase().includes(c[0]));
    if (!m) return `<span class="bd vr">${esc(x)}</span>`;
    if (m[1] === 'holo') return `<span class="bd mu holo">${esc(x)}</span>`;
    return `<span class="bd mu" style="background:${m[1]};color:${m[2]}">${esc(x)}</span>`;
  }).join('');
}

// ===== Suara saat poin bertambah (beda per tier: Legend < Myth < Secret < Forgotten) =====
let AC;
const unlock = () => {
  try { AC = AC || new (window.AudioContext || window.webkitAudioContext)(); if (AC.state === 'suspended') AC.resume(); } catch {}
};
document.addEventListener('click', unlock); document.addEventListener('keydown', unlock);

// Format nada: [frekuensi, jeda mulai (detik), durasi (detik), bentuk gelombang]
const DING = {
  man: [[880, 0, .25, 'sine']],                                                                                   // poin manual
  lg:  [[880, 0, .3, 'sine'], [1320, .12, .3, 'sine']],                                                           // Legend: 2 nada pendek
  my:  [[660, 0, .25, 'triangle'], [880, .12, .25, 'triangle'], [1100, .24, .35, 'triangle']],                    // Myth: 3 nada naik
  sc:  [[523, 0, .2, 'square'], [659, .1, .2, 'square'], [784, .2, .2, 'square'], [1047, .3, .45, 'square']],     // Secret: arpeggio 4 nada
  neg: [[440, 0, .2, 'triangle'], [330, .14, .4, 'triangle']],                                                      // pengurangan poin: 2 nada turun
  fg:  [[392, 0, .25, 'sawtooth'], [523, .13, .25, 'sawtooth'], [659, .26, .25, 'sawtooth'], [784, .39, .25, 'sawtooth'], [1047, .52, .3, 'sawtooth'], [1568, .7, .8, 'sine']]   // Forgotten: fanfare panjang
};
function ding(tier) {
  unlock(); if (!AC || !SND) return;
  const vol = {man: .25, lg: .25, my: .25, sc: .14, fg: .16}[tier] ?? .25;   // square/sawtooth lebih keras, jadi dikecilkan
  (DING[tier] || DING.lg).forEach(([f, d, len, type]) => {
    const o = AC.createOscillator(), g = AC.createGain(), t = AC.currentTime + d;
    o.type = type; o.frequency.value = f;
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + len);
    o.connect(g); g.connect(AC.destination); o.start(t); o.stop(t + len);
  });
}


// Notifikasi boleh menumpuk (tidak ada batas jumlah) agar tidak ada yang tertahan
// info = {evs: [tangkapan baru]} ikan · {man: true} poin manual bertambah · {neg: true} poin dikurangi
const TT = {lg: ['⭐', 'LEGEND'], my: ['🔥', 'MYTH'], sc: ['💎', 'SECRET'], fg: ['👑', 'FORGOTTEN']};
function toast(name, delta, total, info, avatar) {
  const el = document.createElement('div'), evs = info.evs || [], RK = {lg: 1, my: 2, sc: 3, fg: 4};
  let best = info.neg ? 'neg' : info.man ? 'man' : 'lg';
  evs.forEach(x => { const c = tcls(x.tier); if ((RK[c] || 0) > (RK[best] || 0)) best = c; });
  el.className = 'toast t-' + best;
  const av = avatar ? `<img class="ta" src="${esc(avatar)}" alt="" onerror="this.remove()">` : `<span class="ta ta0">${initial(name)}</span>`;
  const pic = (img, ic) => `<div class="tpic">${ic || '🎣'}${img ? `<img src="${esc(img)}" alt="" onerror="this.remove()">` : ''}</div>`;
  const sgn = delta > 0 ? '+' + delta : '−' + Math.abs(delta);
  let rib, body;
  if (info.neg) {
    rib = '<span>⚠️ POIN DIKURANGI</span><em>MINUS</em>';
    body = `${pic(null, '📉')}<div class="tinfo"><span class="tk">PENGURANGAN POIN</span><span class="tfish">Poin berkurang ${Math.abs(delta)}</span><span class="tsub">Dikoreksi admin</span></div>`;
  } else if (info.man) {
    rib = '<span>✨ BONUS POIN</span><em>MANUAL</em>';
    body = `${pic(null, '🎁')}<div class="tinfo"><span class="tk">POIN MANUAL</span><span class="tfish">Bonus +${delta} poin</span><span class="tsub">Ditambahkan admin</span></div>`;
  } else if (evs.length === 1) {
    const e = evs[0], t = TT[tcls(e.tier)] || TT.lg;
    rib = `<span>${t[0]} TANGKAPAN ${t[1]}</span><em>BARU!</em>`;
    body = `${pic(e.img)}<div class="tinfo"><div class="tbd"><span class="bd ${tcls(e.tier)}">${esc(e.tier)}</span>${e.var ? varBadges(e.var) : ''}${e.rule ? '<span class="bd vr" title="Poin dari aturan ikan khusus">★ Khusus</span>' : ''}</div><span class="tfish">${esc(e.fish || 'Ikan')}</span></div>`;
  } else {
    const t = TT[best] || TT.lg;
    rib = `<span>${t[0]} ${evs.length} TANGKAPAN SEKALIGUS</span><em>COMBO</em>`;
    const rows = evs.slice(0, 4).map(e => `<div class="tr2"><span class="bd ${tcls(e.tier)}">${esc(e.tier)}</span><span class="tf2">${esc((e.var ? e.var + ' ' : '') + (e.fish || 'Ikan'))}</span><b>+${e.pts}</b></div>`).join('');
    body = `<div class="tinfo"><div class="tl2">${rows}${evs.length > 4 ? `<div class="tr2 more">+${evs.length - 4} tangkapan lainnya</div>` : ''}</div></div>`;
  }
  const spk = ['my', 'sc', 'fg'].includes(best) ? Array.from({length: 9}, () => `<i class="sp" style="left:${Math.random() * 96}%;top:${8 + Math.random() * 80}%;animation-delay:${(Math.random() * 1.6).toFixed(2)}s"></i>`).join('') : '';
  el.innerHTML = `<div class="rib">${rib}</div><div class="who">${av}<span class="tn">${esc(name)}</span></div><div class="tbody">${body}<div class="gain"><b>${sgn}</b><small>POIN</small></div></div><div class="tfoot"><span>Poin</span><s>${total - delta}</s><span>→</span><i>TOTAL<b class="cu">${total - delta}</b></i></div>${spk}<span class="tbar"></span>`;
  $('#toasts').appendChild(el);
  while ($('#toasts').children.length > MAXT) $('#toasts').firstChild.remove();   // batasi jumlah kartu yang tampil
  // angka total menghitung naik / turun
  const cu = el.querySelector('.cu'), from = total - delta, t0 = performance.now();
  (function step(now) { const k = Math.min(1, (now - t0 - 250) / 700); cu.textContent = k <= 0 ? from : Math.round(from + (total - from) * (1 - Math.pow(1 - k, 3))); if (k < 1 && el.isConnected) requestAnimationFrame(step); else cu.textContent = total; })(t0);
  setTimeout(() => { el.classList.add('out'); setTimeout(() => el.remove(), 300); }, 4500);
}

// Umur tangkapan dihitung dengan jam server (SKEW = selisih jam server - jam browser), supaya jam komputer yang meleset tidak berpengaruh
const TOAST_MAX_AGE = 20;   // detik; tangkapan lebih tua dari ini tidak memunculkan notifikasi
let SKEW = 0;
const ageOf = e => (Date.now() + SKEW - Date.parse(String(e.t).replace(' ', 'T') + 'Z')) / 1000;

// Bandingkan data lama & baru: tampilkan notifikasi + suara untuk peserta yang poinnya bertambah
function notify(prev, next) {
  if (!prev) return;
  let hit = false, best = ''; const neg = [];
  const RANK = {man: 0, lg: 1, my: 2, sc: 3, fg: 4};   // tier tertinggi menentukan suara
  for (const n of next.players) {
    const o = prev.players.find(x => x.slot === n.slot);
    if (!o || o.nama !== n.nama || o.display_name !== n.display_name) continue;
    const name = n.display_name || n.nama;
    const fish = (n.total - n.bonus) - (o.total - o.bonus), man = n.bonus - o.bonus;
    if (fish > 0) {
      // hanya tangkapan BARU & masih segar yang dinotifikasi; yang sudah lewat TOAST_MAX_AGE detik tetap menambah poin di tabel tapi tanpa toast/suara
      const ne = n.ev.slice(0, Math.max(0, n.ev.length - o.ev.length)).filter(x => ageOf(x) <= TOAST_MAX_AGE), e = ne[0];
      if (ne.length) {
        hit = true;
        ne.forEach(x => { const c = tcls(x.tier); if ((RANK[c] ?? 0) > (RANK[best] ?? -1)) best = c; });
        const gain = ne.reduce((a, x) => a + x.pts, 0);
        toast(name, gain, n.total, {evs: ne}, n.avatar);
      }
    }
    if (man > 0) { hit = true; if (!best) best = 'man'; toast(name, man, n.total, {man: true}, n.avatar); }
    else if (man < 0) neg.push([name, man, n.total, n.avatar]);
  }
  // pengurangan poin juga diberi notifikasi (bila banyak peserta turun bersamaan = reset, tanpa notifikasi)
  if (neg.length && neg.length <= 2) { neg.forEach(x => toast(x[0], x[1], x[2], {neg: true}, x[3])); if (!hit) { hit = true; best = 'neg'; } }
  if (hit) ding(best);
}


// ===== Ambil data poin terus-menerus (satu permintaan sekaligus) =====
let D = null;
const dbg = $('#dbg'); if (Q.get('debug') === '1') dbg.hidden = false;
async function poll() {
  try {
    const j = await (await fetch(API, {cache: 'no-store'})).json();
    if (!j || !j.players) throw new Error(j && (j.error || j.message) || 'data kosong');
    if (j.now) SKEW = Date.parse(j.now.replace(' ', 'T') + 'Z') - Date.now();
    // jangan bunyi / toast saat poin tier, centang rarity, atau aturan ikan diubah
    if (!D || JSON.stringify([D.tiers, D.aturan, D.tier_on]) === JSON.stringify([j.tiers, j.aturan, j.tier_on])) notify(D, j);
    D = j;
    dbg.className = ''; dbg.textContent = '● tersambung · ' + new Date().toLocaleTimeString('id-ID', {hour12: false});
  } catch (e) { dbg.className = 'bad'; dbg.textContent = '✕ ' + e.message; }
  setTimeout(poll, 500);
}
poll();

// ===== Mode contoh (?demo=1): untuk mengatur posisi & ukuran di TikTok LIVE Studio =====
if (Q.get('demo') === '1') {
  const S = [
    () => toast('TAZxXenn25', 5, 34, {evs: [{tier: 'Secret', fish: 'Diamond Squid', var: 'Shiny', pts: 5, img: ''}]}, null),
